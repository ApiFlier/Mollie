<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#8b2331">
  <title>Mollie Events</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Lora:wght@500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/css/styles.css?v=20260516j">
</head>
<body>
  <div class="top-nav">
    <a href="/" class="top-nav-link top-nav-active">Events</a>
    <a href="/map" class="top-nav-link">Map</a>
    <a href="/admin/" class="top-nav-link top-nav-admin">Admin</a>
  </div>

  <div id="events-app">
    <header class="events-header">
      <h1 class="events-title">Mollie Events</h1>
      <p class="events-subtitle">Local things to do, within an hour's drive.</p>

      <div class="events-controls">
        <div class="events-filter-row">
          <button class="ev-filter-btn" data-filter="">All</button>
          <button class="ev-filter-btn" data-filter="this_weekend">This Weekend</button>
          <button class="ev-filter-btn" data-filter="drive30" data-max-drive="30">Within 30 min</button>
          <button class="ev-filter-btn ev-filter-active" data-filter="drive60" data-max-drive="60">Within 60 min</button>
          <button class="ev-filter-btn" data-filter="saved">Saved</button>
        </div>
        <div class="events-sort-row">
          <span class="ev-sort-label">Sort:</span>
          <button class="ev-sort-btn ev-sort-active" data-sort="soonest">Soonest</button>
          <button class="ev-sort-btn" data-sort="closest">Closest</button>
        </div>
      </div>
    </header>

    <div id="events-status" class="events-status" style="display:none;"></div>
    <div id="events-list" class="events-list"></div>
  </div>

  <script src="/js/events.js?v=20260516i"></script>
</body>
</html>
