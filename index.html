<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#8b2331">
  <title>Mollie's Guide</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Lora:wght@500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="/css/styles.css?v=20260425c">
</head>
<body>
  <div id="app">
    <header>
      <h1>Mollie's Guide<span class="subtitle">PA pick-your-own &amp; orchards</span></h1>
      <div class="filters">
        <div class="chip-row" id="category-chips"></div>
        <div class="dropdown-row">
          <select id="month-select"></select>
          <select id="crop-select"></select>
        </div>
        <div class="toggle-row">
          <label class="toggle"><input type="checkbox" id="pyo-toggle"> PYO only</label>
          <label class="toggle"><input type="checkbox" id="organic-toggle"> Organic</label>
          <span class="result-count" id="result-count"></span>
        </div>
      </div>
    </header>

    <div id="map"></div>

    <div class="detail-panel" id="detail-panel">
      <button class="close-btn" id="detail-close" aria-label="Close">&times;</button>
      <div id="detail-content"></div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="/js/api.js?v=20260425c"></script>
  <script src="/js/map.js?v=20260425c"></script>
  <script src="/js/filters.js?v=20260425c"></script>
  <script src="/js/main.js?v=20260425c"></script>
</body>
</html>
