services:
  frontend:
    image: nginx:alpine
    container_name: mollies-frontend
    ports:
      - "${FRONTEND_PORT:-8090}:80"
    volumes:
      - ./index.html:/usr/share/nginx/html/index.html:ro
      - ./robots.txt:/usr/share/nginx/html/robots.txt:ro
      - ./css:/usr/share/nginx/html/css:ro
      - ./js:/usr/share/nginx/html/js:ro
      - ./admin:/usr/share/nginx/html/admin:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./proxy_pass.conf:/etc/nginx/proxy_pass.conf:ro
    depends_on:
      - api
    restart: unless-stopped

  api:
    build: ./api
    container_name: mollies-api
    ports:
      - "${API_PORT:-8091}:8080"
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_NAME=mollies_guide
      - DB_USER=mollies
      - DB_PASSWORD=${DB_PASSWORD}
      - FLASK_SECRET=${FLASK_SECRET}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./api:/app
      - ./.htpasswd:/etc/nginx/.htpasswd
    restart: unless-stopped

  db:
    image: mysql:8.0
    container_name: mollies-db
    ports:
      - "${DB_PORT:-3308}:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=mollies_guide
      - MYSQL_USER=mollies
      - MYSQL_PASSWORD=${DB_PASSWORD}
    volumes:
      - mollies_mysql:/var/lib/mysql
      - ./api/data/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  mollies_mysql:
