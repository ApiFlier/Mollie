services:
  app:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: event-map-app
    ports:
      - "${APP_PORT:-8090}:8080"
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_NAME=event_map
      - DB_USER=event_map
      - DB_PASSWORD=${DB_PASSWORD}
      - FLASK_SECRET=${FLASK_SECRET}
      - HOME_LAT=${HOME_LAT:-40.487993}
      - HOME_LNG=${HOME_LNG:--79.805208}
      - EVENTS_CACHE_HOURS=${EVENTS_CACHE_HOURS:-48}
      - EVENT_CACHE_RETENTION_DAYS=${EVENT_CACHE_RETENTION_DAYS:-14}
      - SAVED_EVENT_RETENTION_DAYS=${SAVED_EVENT_RETENTION_DAYS:-}
      - VP_ALGOLIA_APP_ID=${VP_ALGOLIA_APP_ID:-EYQHJ2IY2M}
      - VP_ALGOLIA_API_KEY=${VP_ALGOLIA_API_KEY:-c6d5977cb5cd80c09abfd2a7e5d9e88b}
      - VP_ALGOLIA_INDEX=${VP_ALGOLIA_INDEX:-prod-visit-pittsburgh}
      - EB_ALGOLIA_APP_ID=${EB_ALGOLIA_APP_ID:-EYQHJ2IY2M}
      - EB_ALGOLIA_API_KEY=${EB_ALGOLIA_API_KEY:-c6d5977cb5cd80c09abfd2a7e5d9e88b}
      - EB_ALGOLIA_INDEX=${EB_ALGOLIA_INDEX:-prod-experience-butler-listings}
      - VISIT_PA_SIMPLEVIEW_TOKEN=${VISIT_PA_SIMPLEVIEW_TOKEN:-e23d5076b685912b323caecf66629183}
      - LAUREL_SIMPLEVIEW_TOKEN=${LAUREL_SIMPLEVIEW_TOKEN:-3e0c7cc3125bd4c48ede37f22b2f2f9c}
    volumes:
      - ./.htpasswd:/app/.htpasswd
      - ./api/data:/app/data
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  db:
    image: mysql:8.0
    container_name: event-map-db
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=event_map
      - MYSQL_USER=event_map
      - MYSQL_PASSWORD=${DB_PASSWORD}
    volumes:
      - event_map_db_data:/var/lib/mysql
      - ./mysql/conf.d:/etc/mysql/conf.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h127.0.0.1 -P3306 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  event_map_db_data:
    name: event_map_db_data
