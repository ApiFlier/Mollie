services:
  app:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: event-map-app
    ports:
      - "${APP_PORT:-8090}:8080"
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_NAME=event_map
      - DB_USER=event_map
      - DB_PASSWORD=${DB_PASSWORD}
      - FLASK_SECRET=${FLASK_SECRET}
      - HOME_LAT=${HOME_LAT:-40.487993}
      - HOME_LNG=${HOME_LNG:--79.805208}
    volumes:
      - ./.htpasswd:/app/.htpasswd
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: mysql:8.0
    container_name: event-map-db
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=event_map
      - MYSQL_USER=event_map
      - MYSQL_PASSWORD=${DB_PASSWORD}
    volumes:
      - event_map_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  event_map_db_data:
    name: event_map_db_data
