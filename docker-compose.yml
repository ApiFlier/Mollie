services:
  app:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: event-map-app
    ports:
      - "${APP_PORT:-8090}:8080"
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_NAME=event_map
      - DB_USER=event_map
      - DB_PASSWORD=${DB_PASSWORD}
      - FLASK_SECRET=${FLASK_SECRET}
      - HOME_LAT=${HOME_LAT:-40.487993}
      - HOME_LNG=${HOME_LNG:--79.805208}
    volumes:
      - ./.htpasswd:/app/.htpasswd
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  db:
    image: mysql:8.0
    container_name: event-map-db
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=event_map
      - MYSQL_USER=event_map
      - MYSQL_PASSWORD=${DB_PASSWORD}
    volumes:
      - event_map_db_data:/var/lib/mysql
      - ./mysql/conf.d:/etc/mysql/conf.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h127.0.0.1 -P3306 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  event_map_db_data:
    name: event_map_db_data
