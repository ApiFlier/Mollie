services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.nginx
    container_name: mollies-frontend
    ports:
      - "${FRONTEND_PORT:-8090}:80"
    depends_on:
      - api
    restart: unless-stopped

  api:
    build: ./api
    container_name: mollies-api
    ports:
      - "${API_PORT:-8091}:8080"
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_NAME=mollies_guide
      - DB_USER=mollies
      - DB_PASSWORD=${DB_PASSWORD}
      - FLASK_SECRET=${FLASK_SECRET}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./api:/app
      - ./.htpasswd:/etc/nginx/.htpasswd
    restart: unless-stopped

  db:
    image: mysql:8.0
    container_name: mollies-db
    ports:
      - "${DB_PORT:-3308}:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=mollies_guide
      - MYSQL_USER=mollies
      - MYSQL_PASSWORD=${DB_PASSWORD}
    volumes:
      - mollies_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  mollies_mysql:
