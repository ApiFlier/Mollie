server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # All API requests proxy to Flask; Flask handles auth via cookie
    location /api/ {
        proxy_pass http://api:8080/;
        include /etc/nginx/proxy_pass.conf;
    }

    location = /robots.txt {
        try_files $uri =404;
        access_log off;
    }

    # Admin UI - no nginx auth, Flask checks session
    location /admin/ {
        alias /usr/share/nginx/html/admin/;
        try_files $uri $uri/ /admin/index.html;
    }

    # Public app
    location / {
        try_files $uri $uri/ /index.html;
    }
}
