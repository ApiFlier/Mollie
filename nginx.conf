server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Public read-only API endpoints
    location = /api/health           { proxy_pass http://api:8080/health; include /etc/nginx/proxy_pass.conf; }
    location = /api/categories       { proxy_pass http://api:8080/categories; include /etc/nginx/proxy_pass.conf; }
    location = /api/counties         { proxy_pass http://api:8080/counties; include /etc/nginx/proxy_pass.conf; }
    location = /api/crops/distinct   { proxy_pass http://api:8080/crops/distinct; include /etc/nginx/proxy_pass.conf; }
    location = /api/locations        { proxy_pass http://api:8080/locations; include /etc/nginx/proxy_pass.conf; }
    location ~ ^/api/locations/(\d+)$ {
        if ($request_method != GET) {
            return 401;
        }
        proxy_pass http://api:8080/locations/$1;
        include /etc/nginx/proxy_pass.conf;
    }
    location ~ ^/api/locations/(\d+)/notes$ {
        # GET public, POST requires auth
        limit_except GET {
            auth_basic "Admin";
            auth_basic_user_file /etc/nginx/.htpasswd;
        }
        proxy_pass http://api:8080/locations/$1/notes;
        include /etc/nginx/proxy_pass.conf;
    }

    # Everything else under /api/ requires auth
    location /api/ {
        auth_basic "Admin";
        auth_basic_user_file /etc/nginx/.htpasswd;
        proxy_pass http://api:8080/;
        include /etc/nginx/proxy_pass.conf;
    }

    location = /robots.txt {
        try_files $uri =404;
        access_log off;
    }

    # Admin UI - auth required
    location /admin/ {
        auth_basic "Admin";
        auth_basic_user_file /etc/nginx/.htpasswd;
        alias /usr/share/nginx/html/admin/;
        try_files $uri $uri/ /admin/index.html;
    }

    # Public app
    location / {
        try_files $uri $uri/ /index.html;
    }
}
